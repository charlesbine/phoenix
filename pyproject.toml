[project]
name = "phoenix"
version = "0.1.0"
description = "LED matrix display manager for Tidbyt-style Starlark applets"
requires-python = ">=3.11"
dependencies = [
    "typer[all]",
    "pillow",
    "pydantic>=2",
    "pydantic-settings",
    "spotipy",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "humanize",
    "pyyaml",
    "pyserial",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
wled = ["zeroconf>=0.80"]  # mDNS auto-discovery for the WLED backend
audio = [
    "numpy>=1.26",       # FFT + framebuffer math for the audio visualizer
    "sounddevice>=0.4",  # PortAudio capture (loopback / mic) for live audio
]

[project.scripts]
phoenix = "phoenix.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

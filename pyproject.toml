[project]
name = "phoenix"
version = "0.1.0"
description = "LED matrix display manager for Tidbyt-style Starlark applets"
requires-python = ">=3.11"
dependencies = [
    "typer[all]",
    "pillow",
    "pydantic>=2",
    "pydantic-settings",
    "spotipy",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "httpx",
    "humanize",
    "pyyaml",
    "pyserial",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
phoenix = "phoenix.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

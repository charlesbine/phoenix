[project]
name = "pheonix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.8",
    "humanize>=4.12.1",
    "loguru>=0.6.0",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "pydantic<2",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "streamlit>=1.42.2",
    "tinydb>=4.8.2",
    "tomli>=2.2.1",
    "sptools>=0.0.1",
]

[tool.uv.sources]
sptools = { path = "../sptools" }

[dependency-groups]
dev = ["black>=25.1.0", "jupyter>=1.1.1", "matplotlib>=2", "mypy>=1.15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pheonix = "pheonix.cli:cli"

{% extends "base.html" %}
{% block content %}
<h1>Community Apps</h1>

{% if apps %}
<div class="app-grid">
    {% for app in apps %}
    <div class="app-card">
        <div class="name">{{ app.name }}</div>
        <div class="meta">{{ app.summary }}</div>
        <div class="actions">
            <form action="/api/shop/{{ app.name }}/import" method="post" style="display:inline">
                <button class="btn btn-enable" type="submit">Import</button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<p class="empty">No community apps found. Run <code>phoenix shop</code> to clone the community repo first.</p>
{% endif %}
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Display</title>
    <link rel="icon" href="/static/assets/favicon.ico">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: #000;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            cursor: none;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .display {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }
        .display img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
            object-fit: contain;
        }
        .info-bar {
            height: 28px;
            background: #0d1117;
            border-top: 1px solid #1a1f26;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 11px;
            color: #484f58;
            flex-shrink: 0;
        }
        .info-bar .app-name { color: #8b949e; }
        .info-bar .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #238636;
            display: inline-block;
            margin-right: 6px;
        }
        body:hover .info-bar { opacity: 1; }
        body:not(:hover) .info-bar { opacity: 0; transition: opacity 0.5s 3s; }
        body:hover { cursor: default; }
    </style>
</head>
<body>
    <div class="container">
        <div class="display">
            <img id="img" src="/data/output/current_display.webp" alt="Display" />
        </div>
        <div class="info-bar">
            <div><span class="dot"></span><span class="app-name" id="app-name">—</span></div>
            <div id="time"></div>
        </div>
    </div>
    <script>
        const img = document.getElementById('img');
        const appName = document.getElementById('app-name');
        const timeEl = document.getElementById('time');

        async function refresh() {
            img.src = '/data/output/current_display.webp?t=' + Date.now();
            try {
                const r = await fetch('/api/now-playing');
                const data = await r.json();
                appName.textContent = (data.app || '—').replace(/_/g, ' ');
            } catch {}
            timeEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        refresh();
        setInterval(refresh, 2000);
    </script>
</body>
</html>

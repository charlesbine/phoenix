<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Dashboard</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #58a6ff; margin-bottom: 1.5rem; }
        h2 { color: #8b949e; margin: 1.5rem 0 0.75rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }

        .config-bar {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .config-bar label { color: #8b949e; font-size: 0.85rem; }
        .config-bar select, .config-bar input[type=number] {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .config-bar button {
            background: #238636;
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .config-bar button:hover { background: #2ea043; }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .app-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        .app-card img {
            width: 160px;
            height: 160px;
            image-rendering: pixelated;
            background: #000;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }
        .app-card .name { font-weight: 600; margin-bottom: 0.25rem; }
        .app-card .meta { font-size: 0.75rem; color: #8b949e; margin-bottom: 0.5rem; }
        .app-card .actions { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; }

        .btn {
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            color: white;
        }
        .btn-enable { background: #238636; }
        .btn-disable { background: #da3633; }
        .btn-render { background: #1f6feb; }
        .btn-activate { background: #8957e5; }
        .btn:hover { opacity: 0.85; }

        .empty { color: #484f58; font-style: italic; padding: 1rem 0; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>

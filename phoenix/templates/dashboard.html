<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix</title>
    <link rel="icon" href="/static/assets/favicon.ico">
    <link rel="apple-touch-icon" href="/static/assets/phoenix-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-card: #131920;
            --bg-input: #0c1018;
            --border: #1e2731;
            --border-hover: #2d3a47;
            --text-primary: #e0e6ed;
            --text-secondary: #7a8a9e;
            --text-muted: #4a5568;
            --accent-amber: #F0A030;
            --accent-amber-dim: rgba(240, 160, 48, 0.15);
            --accent-blue: #58a6ff;
            --accent-blue-dim: rgba(88, 166, 255, 0.12);
            --accent-green: #1DB954;
            --accent-green-dim: rgba(29, 185, 84, 0.12);
            --accent-purple: #a78bfa;
            --accent-purple-dim: rgba(167, 139, 250, 0.15);
            --accent-red: #f87171;
            --accent-red-dim: rgba(248, 113, 113, 0.12);
            --font-heading: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.4);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-heading);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ---- Header ---- */
        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 2rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        .header-logo {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            filter: drop-shadow(0 0 12px rgba(240, 160, 48, 0.4));
        }
        .header-title {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.35rem;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .header-status {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-left: auto;
        }
        .status-dot {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            font-family: var(--font-mono);
            color: var(--text-secondary);
        }
        .status-dot .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-green { background: var(--accent-green); box-shadow: 0 0 6px rgba(29, 185, 84, 0.5); }
        .dot-red { background: var(--accent-red); box-shadow: 0 0 6px rgba(248, 113, 113, 0.5); }
        .dot-yellow { background: var(--accent-amber); box-shadow: 0 0 6px rgba(240, 160, 48, 0.5); }

        /* ---- Main layout ---- */
        .main-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem 2rem 3rem;
        }

        /* ---- Section headings ---- */
        .section-title {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin: 2rem 0 0.75rem;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 2rem 0 0.75rem;
        }
        .section-header .section-title { margin: 0; }

        /* ---- Hero section ---- */
        .hero {
            display: flex;
            gap: 1.5rem;
            align-items: stretch;
            margin-bottom: 1.5rem;
        }
        .hero-preview {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }
        .hero-preview .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            font-family: var(--font-mono);
        }
        .hero-preview img {
            width: 280px;
            height: 280px;
            image-rendering: pixelated;
            background: #000;
            border-radius: var(--radius-md);
            display: block;
        }
        .hero-preview .now-playing {
            color: var(--accent-amber);
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 0.75rem;
            text-align: center;
        }

        .hero-controls {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.25rem 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .hero-controls .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .hero-controls label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
        .hero-controls select,
        .hero-controls input[type=number] {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 0.7rem;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
            transition: border-color var(--transition);
        }
        .hero-controls select:focus,
        .hero-controls input[type=number]:focus {
            border-color: var(--accent-blue);
        }
        .hero-controls input[type=range] {
            width: 100%;
            accent-color: var(--accent-amber);
            height: 6px;
            cursor: pointer;
        }
        .brightness-value {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-amber);
            font-weight: 500;
        }
        .hero-controls .btn-update {
            margin-top: auto;
            align-self: flex-start;
        }

        @media (max-width: 768px) {
            .hero { flex-direction: column; }
            .hero-preview img { width: 200px; height: 200px; }
            .main-content { padding: 1rem; }
            .header { padding: 0.75rem 1rem; }
        }

        /* ---- App grid ---- */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
        }

        /* ---- App card ---- */
        .app-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1rem;
            text-align: center;
            transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
            position: relative;
            overflow: visible;
        }
        .app-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: var(--border-hover);
        }
        .app-card img {
            width: 150px;
            height: 150px;
            image-rendering: pixelated;
            background: #000;
            border-radius: var(--radius-md);
            margin: 0 auto 0.6rem;
            display: block;
        }
        .app-card .img-placeholder {
            width: 150px;
            height: 150px;
            background: var(--bg-input);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            margin: 0 auto 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-family: var(--font-mono);
        }
        .app-card .name {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
        }
        .app-card .meta {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 0.6rem;
        }

        .app-card .primary-actions {
            display: flex;
            gap: 0.4rem;
            justify-content: center;
            align-items: center;
        }

        /* More menu */
        .more-menu-wrapper {
            position: relative;
            display: inline-block;
        }
        .more-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            line-height: 1;
        }
        .more-btn:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }
        .more-menu-wrapper.open {
            z-index: 100;
        }
        .more-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-md);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
            min-width: 160px;
            z-index: 100;
            overflow: hidden;
            animation: dropdownIn 0.15s ease-out;
        }
        @keyframes dropdownIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .more-dropdown button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.5rem 0.85rem;
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-heading);
            font-size: 0.8rem;
            cursor: pointer;
            text-align: left;
            transition: background var(--transition);
        }
        .more-dropdown button:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .more-dropdown button.danger {
            color: var(--accent-red);
        }
        .more-dropdown button.danger:hover {
            background: var(--accent-red-dim);
        }
        .more-dropdown .dropdown-divider {
            border-top: 1px solid var(--border);
            margin: 0.2rem 0;
        }

        /* Drag */
        .app-card[draggable="true"] { cursor: grab; }
        .app-card[draggable="true"]:active { cursor: grabbing; }
        .app-card.drag-over {
            border-color: var(--accent-blue);
            border-style: dashed;
            box-shadow: 0 0 0 2px var(--accent-blue-dim);
        }

        /* ---- Disabled apps row ---- */
        .disabled-grid {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .disabled-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            opacity: 0.6;
            transition: opacity var(--transition);
        }
        .disabled-card:hover { opacity: 0.85; }
        .disabled-card .name {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* ---- Buttons ---- */
        .btn {
            border: none;
            padding: 0.3rem 0.65rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: var(--font-heading);
            font-size: 0.75rem;
            font-weight: 500;
            color: white;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; filter: none; }

        .btn-show { background: var(--accent-purple); }
        .btn-enable { background: var(--accent-green); }
        .btn-disable { background: #b33; }
        .btn-render { background: var(--accent-blue); }
        .btn-cycle { background: #6d5dbb; }
        .btn-add { background: var(--accent-green); }
        .btn-delete { background: #6e1b1b; }
        .btn-config { background: #2a3240; }
        .btn-config.has-config { background: var(--accent-blue); }
        .btn-neutral { background: #2a3240; color: var(--text-secondary); }

        /* ---- Config editor ---- */
        .config-editor {
            margin-top: 0.6rem;
            text-align: left;
            border-top: 1px solid var(--border);
            padding-top: 0.6rem;
        }
        .config-editor .config-row {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 0.3rem;
            align-items: center;
        }
        .config-editor input,
        .config-editor select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.25rem 0.4rem;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            flex: 1;
            min-width: 0;
            outline: none;
            transition: border-color var(--transition);
        }
        .config-editor input:focus,
        .config-editor select:focus {
            border-color: var(--accent-blue);
        }
        .config-editor input.key { flex: 0.4; }
        .config-editor .remove-btn {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0 0.2rem;
        }

        /* ---- Modal ---- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.15s;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
        }
        .modal h2 {
            font-family: var(--font-heading);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1.15rem;
            margin: 0 0 1rem;
            text-transform: none;
            letter-spacing: 0;
        }
        .modal .field { margin-bottom: 0.75rem; }
        .modal .field label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
            font-family: var(--font-mono);
        }
        .modal .field input,
        .modal .field select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 0.7rem;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            outline: none;
            transition: border-color var(--transition);
        }
        .modal .field input:focus,
        .modal .field select:focus {
            border-color: var(--accent-blue);
        }
        .modal .field-row {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.3rem;
            align-items: center;
        }
        .modal .field-row input,
        .modal .field-row select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.4rem 0.5rem;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            flex: 1;
            min-width: 0;
            outline: none;
        }
        .modal .actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            justify-content: flex-end;
        }
        .modal .actions .btn {
            padding: 0.45rem 1.1rem;
            font-size: 0.85rem;
        }
        .modal .divider {
            border-top: 1px solid var(--border);
            margin: 0.85rem 0;
        }

        /* ---- Collapsible sections ---- */
        .collapsible-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
            margin: 2rem 0 0;
            padding: 0.5rem 0;
        }
        .collapsible-header .section-title { margin: 0; }
        .collapsible-header .chevron {
            font-size: 0.7rem;
            color: var(--text-muted);
            transition: transform var(--transition);
        }
        .collapsible-header .chevron.open {
            transform: rotate(90deg);
        }
        .collapsible-body {
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .collapsible-body.collapsed {
            max-height: 0;
        }

        /* ---- Schedule section ---- */
        .schedule-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
        }
        .schedule-panel .active-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.7rem;
            background: var(--accent-green-dim);
            border: 1px solid rgba(29, 185, 84, 0.25);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            color: var(--accent-green);
            margin-bottom: 0.75rem;
            font-family: var(--font-mono);
        }
        .schedule-input {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.35rem 0.55rem;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            outline: none;
        }
        .schedule-input:focus { border-color: var(--accent-blue); }

        /* ---- Available applets ---- */
        .available-card {
            background: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: 1rem;
            text-align: center;
            transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
        }
        .available-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: var(--border-hover);
        }
        .available-card img {
            width: 150px;
            height: 150px;
            image-rendering: pixelated;
            background: #000;
            border-radius: var(--radius-md);
            margin: 0 auto 0.6rem;
            display: block;
        }
        .available-card .img-placeholder {
            width: 150px;
            height: 150px;
            background: var(--bg-input);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            margin: 0 auto 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-family: var(--font-mono);
        }
        .available-card .name {
            font-family: var(--font-heading);
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        /* ---- Misc ---- */
        .empty {
            color: var(--text-muted);
            font-style: italic;
            padding: 0.75rem 0;
            font-size: 0.85rem;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--accent-red);
            color: white;
            padding: 0.75rem 1.1rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            max-width: 400px;
            animation: toastIn 0.25s ease-out;
            z-index: 300;
            font-family: var(--font-heading);
            box-shadow: 0 8px 24px rgba(248, 113, 113, 0.3);
            cursor: pointer;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { h, render } from 'https://esm.sh/preact@10.25.4';
        import { useState, useEffect, useCallback, useRef } from 'https://esm.sh/preact@10.25.4/hooks';
        import htm from 'https://esm.sh/htm@3.1.1';

        const html = htm.bind(h);

        // --- API helpers ---
        async function api(path, method = 'GET', body = null) {
            const opts = { method, headers: {} };
            if (body) {
                opts.headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(body);
            }
            const res = await fetch('/api' + path, opts);
            return res.json();
        }

        // Global image cache buster — incremented on renders
        let globalImgKey = Date.now();

        // --- Components ---

        function StatusDots() {
            const [health, setHealth] = useState({ m4: null, mqtt: null });
            useEffect(() => {
                const check = async () => {
                    try {
                        const r = await fetch('/api/health');
                        const data = await r.json();
                        setHealth(data);
                    } catch {
                        setHealth({ m4: false, mqtt: false });
                    }
                };
                check();
                const id = setInterval(check, 10000);
                return () => clearInterval(id);
            }, []);

            const dotClass = (val) => val === true ? 'dot-green' : val === false ? 'dot-red' : 'dot-yellow';

            return html`
                <div class="header-status">
                    <div class="status-dot">
                        <span class=${'dot ' + dotClass(health.m4)}></span>
                        M4
                    </div>
                    <div class="status-dot">
                        <span class=${'dot ' + dotClass(health.mqtt)}></span>

        function ConfigEditor({ appName, config, onSave }) {
            const [schema, setSchema] = useState(null);
            const [values, setValues] = useState({...config});
            const [dirty, setDirty] = useState(false);
            const [extraEntries, setExtraEntries] = useState([]);

            useEffect(() => {
                api('/apps/' + appName + '/schema').then(s => setSchema(s));
            }, [appName]);

            // Only sync from props when not actively editing
            useEffect(() => {
                if (!dirty) setValues({...config});
            }, [config]);

            const set = (key, val) => {
                setValues(v => ({...v, [key]: val}));
                setDirty(true);
            };
            const save = () => {
                const merged = {...values};
                extraEntries.forEach(([k, v]) => { if (k.trim()) merged[k.trim()] = v; });
                onSave(merged);
                setDirty(false);
            };

            const schemaKeys = (schema || []).map(f => f.id);
            const extraKeys = Object.keys(values).filter(k => !schemaKeys.includes(k));

            const renderField = (field) => {
                const val = values[field.id] || field.default || '';
                if (field.type === 'toggle') {
                    return html`
                        <div class="config-row" key=${field.id}>
                            <label style="flex:1; font-size: 0.72rem; color: var(--text-secondary)">${field.name}</label>
                            <input type="checkbox" checked=${val === 'true'}
                                   onChange=${e => set(field.id, e.target.checked ? 'true' : 'false')} />
                        </div>
                    `;
                }
                if (field.type === 'dropdown' && field.options) {
                    return html`
                        <div class="config-row" key=${field.id}>
                            <label style="flex:0.4; font-size: 0.72rem; color: var(--text-secondary)">${field.name}</label>
                            <select value=${val} onChange=${e => set(field.id, e.target.value)}>
                                ${field.options.map(o => html`<option value=${o.value}>${o.display}</option>`)}
                            </select>
                        </div>
                    `;
                }
                if (field.type === 'datetime') {
                    return html`
                        <div class="config-row" key=${field.id}>
                            <label style="flex:0.4; font-size: 0.72rem; color: var(--text-secondary)">${field.name}</label>
                            <input type="datetime-local" value=${val ? val.slice(0, 16) : ''}
                                   onChange=${e => set(field.id, e.target.value + ':00Z')} />
                        </div>
                    `;
                }
                if (field.type === 'color') {
                    return html`
                        <div class="config-row" key=${field.id}>
                            <label style="flex:0.4; font-size: 0.72rem; color: var(--text-secondary)">${field.name}</label>
                            <input type="color" value=${val || '#000000'} style="flex:0; width:2rem; height:1.5rem; padding:0; border:none; background:none;"
                                   onChange=${e => set(field.id, e.target.value)} />
                        </div>
                    `;
                }
                // text, location, and everything else: plain text input
                return html`
                    <div class="config-row" key=${field.id}>
                        <label style="flex:0.4; font-size: 0.72rem; color: var(--text-secondary)">${field.name}</label>
                        <input value=${val} placeholder=${field.desc || field.id}
                               onInput=${e => set(field.id, e.target.value)} />
                    </div>
                `;
            };

            if (schema === null) return html`<div class="config-editor"><span class="spinner" /></div>`;

            return html`
                <div class="config-editor">
                    ${schema.length > 0
                        ? schema.map(renderField)
                        : html`<div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:0.3rem">No schema -- add custom keys below</div>`
                    }
                    ${extraKeys.map(k => html`
                        <div class="config-row" key=${k}>
                            <input class="key" value=${k} disabled style="opacity:0.6" />
                            <input value=${values[k] || ''} onInput=${e => set(k, e.target.value)} />
                            <button class="remove-btn" onClick=${() => {
                                const next = {...values};
                                delete next[k];
                                setValues(next);
                                setDirty(true);
                            }}>x</button>
                        </div>
                    `)}
                    <div style="display: flex; gap: 0.3rem; margin-top: 0.4rem;">
                        <button class="btn btn-config" onClick=${() => setExtraEntries([...extraEntries, ['', '']])}>+ Custom</button>
                        ${dirty && html`<button class="btn btn-enable" onClick=${save}>Save</button>`}
                    </div>
                    ${extraEntries.map(([k, v], i) => html`
                        <div class="config-row" key=${'extra-' + i}>
                            <input class="key" value=${k} placeholder="key"
                                   onInput=${e => { const n = [...extraEntries]; n[i] = [e.target.value, v]; setExtraEntries(n); setDirty(true); }} />
                            <input value=${v} placeholder="value"
                                   onInput=${e => { const n = [...extraEntries]; n[i] = [k, e.target.value]; setExtraEntries(n); setDirty(true); }} />
                            <button class="remove-btn" onClick=${() => { setExtraEntries(extraEntries.filter((_, j) => j !== i)); setDirty(true); }}>x</button>
                        </div>
                    `)}
                </div>
            `;
        }

                    const result = await api('/apps/' + app.name + '/' + act, 'POST');

                    if (act === 'render') setRenderKey(Date.now());

                    onAction(e.message);
                } finally {
                    setRendering(false);
                }
            };

            const saveConfig = async (cfg) => {
                await api('/apps/' + app.name + '/config', 'PUT', cfg);
                onAction();
            };

            const deleteApp = async () => {
                if (!confirm('Remove ' + app.name + ' from the database?')) return;
                await api('/apps/' + app.name, 'DELETE');
                onAction();
            };

            const savePreset = async (preset) => {
                await api('/apps/' + app.name + '/preset', 'PUT', { preset });
                onAction();
            };

            const savePriority = async (p) => {
                await api('/apps/' + app.name + '/priority', 'PUT', { priority: p });
                onAction();
            };

            const dragProps = draggable ? {
                draggable: true,
                onDragStart: e => { e.dataTransfer.effectAllowed = 'move'; onDragStart(app.name); },
                onDragOver: e => { e.preventDefault(); setDragOver(true); onDragOver(app.name); },
                onDragLeave: () => setDragOver(false),
                onDrop: e => { e.preventDefault(); setDragOver(false); onDrop(app.name); },

            } : {};

            const hasConfig = app.pixlet_config && Object.keys(app.pixlet_config).length > 0;

                                ${rendering ? 'Rendering...' : 'Render'}

                            <button onClick=${() => setShowConfig(!showConfig)}>

                            <div class="dropdown-divider" />

                                ? html`<button onClick=${() => action('disable')}>Disable</button>`
                                : html`<button onClick=${() => action('enable')}>Enable</button>`
                            }

                                ? html`<button onClick=${() => action('deactivate')}>Remove from Cycle</button>`
                                : html`<button onClick=${() => action('activate')}>Add to Cycle</button>`
                            }
                            <div class="dropdown-divider" />
                            <button class="danger" onClick=${deleteApp}>Delete</button>
                        <//>
                    </div>
                    ${showConfig && html`
                        <${ConfigEditor} appName=${app.name} config=${app.pixlet_config} onSave=${saveConfig} />
                        <div class="config-editor" style="border-top: none; padding-top: 0;">
                            <div class="config-row">
                                <label style="flex:0.6; font-size: 0.72rem; color: var(--text-secondary)">Refresh</label>
                                <select value=${app.refresh_preset} onChange=${e => savePreset(e.target.value)}>
                                    <option value="realtime">Realtime (30s)</option>
                                    <option value="frequent">Frequent (5m)</option>
                                    <option value="ambient">Ambient (30m)</option>
                                </select>
                            </div>
                            <div class="config-row">
                                <label style="flex:0.6; font-size: 0.72rem; color: var(--text-secondary)">Priority</label>
                                <select value=${app.priority} onChange=${e => savePriority(parseInt(e.target.value))}>
                                    <option value="0">Normal</option>
                                    <option value="1">High (2x)</option>
                                    <option value="2">Higher (3x)</option>
                                    <option value="3">Highest (4x)</option>
                                </select>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        function AvailableCard({ name, onAdd, onError, imgTick }) {
            const [adding, setAdding] = useState(false);
            const [previewing, setPreviewing] = useState(false);
            const [renderKey, setRenderKey] = useState(0);
            const imgKey = (imgTick || 0) + renderKey;
            const add = async () => {
                setAdding(true);
                await api('/apps/' + name + '/add', 'POST');
                onAdd();
            };
            const preview = async () => {
                setPreviewing(true);
                try {
                    const result = await api('/apps/' + name + '/preview', 'POST');

                        onError(result.error);
                    } else if (result.info) {

                } finally {
                    setPreviewing(false);

        // Stable field wrapper — defined outside component to avoid remount
        const F = ({label, children}) => html`<div class="field"><label>${label}</label>${children}</div>`;

        // Image with placeholder fallback
        function AppImg({ src, alt }) {
            const [failed, setFailed] = useState(false);
            useEffect(() => setFailed(false), [src]);
            if (failed) return html`<div class="img-placeholder">No preview</div>`;
            return html`<img src=${src} alt=${alt} onError=${() => setFailed(true)} />`;
        }

        const LAYOUTS = [
            { value: 'big_number', label: 'Big Number' },
            { value: 'key_value', label: 'Key/Value List' },
            { value: 'marquee', label: 'Scrolling Text' },
            { value: 'multi_stat', label: 'Multi Stat' },
            { value: 'sparkline', label: 'Sparkline Chart' },
        ];

        function PanelBuilder({ onCreated, onError }) {
            const [open, setOpen] = useState(false);
            const [creating, setCreating] = useState(false);
            const [id, setId] = useState('');
            const [title, setTitle] = useState('');
            const [layout, setLayout] = useState('big_number');
            const [sourceType, setSourceType] = useState('static');
            const [url, setUrl] = useState('');
            const [ttl, setTtl] = useState(300);
            const [authType, setAuthType] = useState('none');
            const [authToken, setAuthToken] = useState('');
            const [authHeader, setAuthHeader] = useState('X-API-Key');
            const [mqttTopic, setMqttTopic] = useState('');
            const [haEntityId, setHaEntityId] = useState('');
            const [haTtl, setHaTtl] = useState(60);
            const [value, setValue] = useState('');
            const [unit, setUnit] = useState('');
            const [color, setColor] = useState('#FFFFFF');
            const [text, setText] = useState('');
            const [items, setItems] = useState([{ key: '', value: '' }]);
            const [stats, setStats] = useState([{ label: '', value: '', color: '#FFFFFF' }]);
            const [valuePath, setValuePath] = useState('');
            const [valueTransform, setValueTransform] = useState('');
            const [pointsPath, setPointsPath] = useState('');
            const [pointValueKey, setPointValueKey] = useState('');
            const [pointTransform, setPointTransform] = useState('');
            const [textPath, setTextPath] = useState('');
            const [itemMappings, setItemMappings] = useState([{ key: '', value_path: '', unit: '' }]);
            const [statMappings, setStatMappings] = useState([{ label: '', value_path: '', unit: '', color: '#FFFFFF' }]);

            const [previewUrl, setPreviewUrl] = useState('');
            const [previewing, setPreviewing] = useState(false);
            const previewTimer = useRef(null);

            const refreshPreview = () => {
                clearTimeout(previewTimer.current);
                previewTimer.current = setTimeout(async () => {
                    const config = { color };
                    const data_source = { type: sourceType };
                    const addMappings = (ds) => {
                        ds.mappings = {};
                        if (layout === 'big_number') { ds.mappings.value = valuePath; if (valueTransform) ds.mappings.transform = valueTransform; config.unit = unit; }
                        else if (layout === 'key_value') { ds.mappings.items = itemMappings.filter(m => m.key); }
                        else if (layout === 'marquee') { ds.mappings.text = textPath; }
                        else if (layout === 'multi_stat') { ds.mappings.stats = statMappings.filter(m => m.label); }
                        else if (layout === 'sparkline') {
                            ds.mappings.points = pointsPath;
                            if (pointValueKey) ds.mappings.point_value = pointValueKey;
                            if (pointTransform) ds.mappings.point_transform = pointTransform;
                            if (valuePath) ds.mappings.value = valuePath;
                            if (valueTransform) ds.mappings.transform = valueTransform;
                        }
                    };
                    if (sourceType === 'http') {
                        data_source.url = url; data_source.ttl = ttl;
                        if (authType !== 'none') {
                            data_source.auth = { type: authType, token: authToken };
                            if (authType === 'api_key') data_source.auth.header = authHeader;
                        }
                        addMappings(data_source);
                    } else if (sourceType === 'mqtt') {
                        data_source.topic = mqttTopic;
                        addMappings(data_source);
                    } else if (sourceType === 'ha') {
                        data_source.entity_id = haEntityId;
                        data_source.ttl = haTtl;
                        addMappings(data_source);
                    } else {
                        if (layout === 'big_number') { config.value = value || '42'; config.unit = unit; }
                        else if (layout === 'key_value') { config.items = items.filter(i => i.key).length ? items.filter(i => i.key) : [{key:'Label', value:'Value'}]; }
                        else if (layout === 'marquee') { config.text = text || 'Preview text...'; }
                        else if (layout === 'multi_stat') { config.stats = stats.filter(s => s.label).length ? stats.filter(s => s.label) : [{label:'Stat', value:'0', color:'#FFFFFF'}]; }
                    }
                    setPreviewing(true);
                    try {
                        const r = await fetch('/api/panels/preview', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ layout, title: title || 'Preview', config, data_source }),
                        });
                        const result = await r.json();
                        if (result.preview_url) setPreviewUrl(result.preview_url);
                    } finally { setPreviewing(false); }
                }, 500);
            };

            // Auto-preview on any change (debounced 500ms in refreshPreview)
            const depsKey = [open, layout, sourceType, title, value, unit, color, text, url, ttl, valuePath, textPath,
                authType, authToken, authHeader, mqttTopic, haEntityId, haTtl,
                JSON.stringify(items), JSON.stringify(stats), JSON.stringify(itemMappings), JSON.stringify(statMappings)].join('|');
            useEffect(() => { if (open) refreshPreview(); }, [depsKey]);

            const reset = () => {
                setId(''); setTitle(''); setValue(''); setUnit(''); setText('');
                setColor('#FFFFFF'); setUrl(''); setTtl(300); setValuePath(''); setTextPath('');
                setAuthType('none'); setAuthToken(''); setAuthHeader('X-API-Key');
                setMqttTopic(''); setHaEntityId(''); setHaTtl(60);
                setPointsPath(''); setPointValueKey(''); setPointTransform('');
                setLayout('big_number'); setSourceType('static');
                setItems([{ key: '', value: '' }]); setStats([{ label: '', value: '', color: '#FFFFFF' }]);
                setItemMappings([{ key: '', value_path: '', unit: '' }]);
                setStatMappings([{ label: '', value_path: '', unit: '', color: '#FFFFFF' }]);
            };

            const close = () => { setOpen(false); reset(); };

            const create = async () => {
                if (!id.trim()) { onError('Panel ID is required'); return; }
                setCreating(true);
                try {
                    const config = { color };
                    const data_source = { type: sourceType };
                    const addCreateMappings = (ds) => {
                        ds.mappings = {};
                        if (layout === 'big_number') { ds.mappings.value = valuePath; if (valueTransform) ds.mappings.transform = valueTransform; config.unit = unit; }
                        else if (layout === 'key_value') { ds.mappings.items = itemMappings.filter(m => m.key); }
                        else if (layout === 'marquee') { ds.mappings.text = textPath; }
                        else if (layout === 'multi_stat') { ds.mappings.stats = statMappings.filter(m => m.label); }
                        else if (layout === 'sparkline') {
                            ds.mappings.points = pointsPath;
                            if (pointValueKey) ds.mappings.point_value = pointValueKey;
                            if (pointTransform) ds.mappings.point_transform = pointTransform;
                            if (valuePath) ds.mappings.value = valuePath;
                            if (valueTransform) ds.mappings.transform = valueTransform;
                        }
                    };
                    if (sourceType === 'http') {
                        data_source.url = url; data_source.ttl = ttl;
                        if (authType !== 'none') {
                            data_source.auth = { type: authType, token: authToken };
                            if (authType === 'api_key') data_source.auth.header = authHeader;
                        }
                        addCreateMappings(data_source);
                    } else if (sourceType === 'mqtt') {
                        data_source.topic = mqttTopic;
                        addCreateMappings(data_source);
                    } else if (sourceType === 'ha') {
                        data_source.entity_id = haEntityId;
                        data_source.ttl = haTtl;
                        addCreateMappings(data_source);
                    } else {
                        if (layout === 'big_number') { config.value = value; config.unit = unit; }
                        else if (layout === 'key_value') { config.items = items.filter(i => i.key); }
                        else if (layout === 'marquee') { config.text = text; }
                        else if (layout === 'multi_stat') { config.stats = stats.filter(s => s.label); }
                    }
                    const result = await api('/panels', 'POST', {
                        id: id.trim().toLowerCase().replace(/\s+/g, '_'),
                        layout, title, config, data_source,
                    });
                    if (result.error) { onError(result.error); return; }
                    close();
                    onCreated();
                } finally { setCreating(false); }
            };

            if (!open) {
                return html`<button class="btn btn-enable" onClick=${() => setOpen(true)}>+ New Panel</button>`;
            }

            return html`
                <div class="modal-overlay" onClick=${e => { if (e.target === e.currentTarget) close(); }}>
                    <div class="modal">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem;">
                            <h2 style="margin:0">Create Dashboard Panel</h2>
                            <div style="flex-shrink:0; margin-left:1rem; text-align:center;">

        function ScheduleManager({ apps, playlists, schedule, onUpdate, onError }) {
            const [showCreate, setShowCreate] = useState(false);
            const [newName, setNewName] = useState('');
            const [selectedApps, setSelectedApps] = useState([]);
            const [rulePlaylist, setRulePlaylist] = useState('');
            const [ruleStart, setRuleStart] = useState('09:00');
            const [ruleEnd, setRuleEnd] = useState('17:00');
            const [ruleDays, setRuleDays] = useState(['mon','tue','wed','thu','fri','sat','sun']);
            const allApps = apps.filter(a => a.enabled);
            const allDays = ['mon','tue','wed','thu','fri','sat','sun'];

            const createPlaylist = async () => {
                if (!newName.trim()) return;
                const id = newName.trim().toLowerCase().replace(/\s+/g, '_');
                await api('/playlists', 'POST', { id, name: newName.trim(), app_names: selectedApps });
                setNewName(''); setSelectedApps([]); setShowCreate(false);
                onUpdate();
            };
            const deletePlaylist = async (id) => {
                await api('/playlists/' + id, 'DELETE');
                onUpdate();
            };
            const addRule = async () => {
                if (!rulePlaylist) return;
                await api('/schedule', 'POST', {
                    playlist_id: rulePlaylist, start_time: ruleStart, end_time: ruleEnd, days: ruleDays,
                });
                onUpdate();
            };
            const deleteRule = async (id) => {
                await api('/schedule/' + id, 'DELETE');
                onUpdate();
            };
            const toggleDay = (d) => {
                setRuleDays(ruleDays.includes(d) ? ruleDays.filter(x => x !== d) : [...ruleDays, d]);
            };

            return html`
                <div class="schedule-panel">
                    ${schedule.active_playlist && html`
                        <div class="active-badge">
                            Active: <strong>${schedule.active_playlist.name}</strong>
                        </div>
                    `}

                            <strong style="color:var(--text-primary)">${p.name}</strong>
                            <span style="color:var(--text-muted); font-family:var(--font-mono); font-size:0.75rem;">${p.app_names.length} apps</span>
                            <button class="btn btn-delete" style="margin-left:auto; font-size:0.65rem; padding:0.15rem 0.4rem;"

                                   placeholder="Playlist name" onInput=${e => setNewName(e.target.value)} />
                            <div style="display:flex; flex-wrap:wrap; gap:0.35rem; margin-bottom:0.5rem;">
                                ${allApps.map(a => html`

                                        <input type="checkbox" checked=${selectedApps.includes(a.name)}
                                               onChange=${() => setSelectedApps(selectedApps.includes(a.name)

        function PanelCard({ panel, onAction, onError, imgTick }) {
            const [deleting, setDeleting] = useState(false);
            const [editing, setEditing] = useState(false);
            const [editConfig, setEditConfig] = useState(JSON.stringify(panel.config || {}, null, 2));
            const [editSource, setEditSource] = useState(JSON.stringify(panel.data_source || {}, null, 2));
            const [editTitle, setEditTitle] = useState(panel.title);
            const [saving, setSaving] = useState(false);

            const del_ = async () => {
                if (!confirm('Delete panel ' + panel.id + '?')) return;
                setDeleting(true);
                await api('/panels/' + panel.id, 'DELETE');
                onAction();
            };
            const save = async () => {
                setSaving(true);
                try {
                    const result = await api('/panels/' + panel.id, 'PUT', {
                        title: editTitle,
                        config: JSON.parse(editConfig),
                        data_source: JSON.parse(editSource),
                    });
                    if (result.error) { onError(result.error); return; }
                    setEditing(false);
                    onAction();
                } catch(e) { onError(e.message); }
                finally { setSaving(false); }
            };

            if (editing) {
                const taStyle = "width:100%; background:var(--bg-input); border:1px solid var(--border); color:var(--text-primary); padding:0.5rem; border-radius:var(--radius-sm); font-size:0.75rem; font-family:var(--font-mono); resize:vertical; outline:none;";
                return html`
                    <div class="modal-overlay" onClick=${e => { if (e.target === e.currentTarget) setEditing(false); }}>
                        <div class="modal">
                            <h2 style="margin:0 0 1rem">Edit: ${panel.id}</h2>
                            <${F} label="Title">
                                <input value=${editTitle} onInput=${e => setEditTitle(e.target.value)} />
                            <//>
                            <${F} label="Config (JSON)">
                                <textarea rows="4" style=${taStyle} value=${editConfig}
                                          onInput=${e => setEditConfig(e.target.value)} />
                            <//>
                            <${F} label="Data Source (JSON)">
                                <textarea rows="8" style=${taStyle} value=${editSource}
                                          onInput=${e => setEditSource(e.target.value)} />
                            <//>
                            <div class="actions">
                                <button class="btn btn-neutral" onClick=${() => setEditing(false)}>Cancel</button>
                                <button class="btn btn-enable" disabled=${saving} onClick=${save}>
                                    ${saving ? html`<span class="spinner" />` : 'Save & Re-render'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            return html`
                <div class="app-card">
                    <${AppImg} src=${'/static/outputs/panel_' + panel.id + '.large.webp?t=' + (imgTick || 0)} alt=${panel.id} />
                    <div class="name">${panel.title || panel.id}</div>
                    <div class="meta">${panel.layout} / ${panel.data_source?.type || 'static'}</div>
                    <div class="primary-actions">
                        <button class="btn btn-config" onClick=${() => setEditing(true)}>Edit</button>
                        <button class="btn btn-delete" disabled=${deleting} onClick=${del_}>Delete</button>
                    </div>
                </div>
            `;
        }

        function Toast({ message, onClose }) {
            useEffect(() => {
                const t = setTimeout(onClose, 4000);
                return () => clearTimeout(t);
            }, [message]);
            if (!message) return null;
            return html`<div class="toast" onClick=${onClose}>${message}</div>`;
        }

                        ${headerExtra && html`<span onClick=${e => e.stopPropagation()}>${headerExtra}</span>`}
                    </div>
                    <div class=${'collapsible-body' + (open ? '' : ' collapsed')} style=${open ? '' : 'max-height:0'}>
                        <div style="padding-bottom:0.5rem;">
                            ${children}
                        </div>

                </div>
            `;
        }

        function App() {
            const [apps, setApps] = useState([]);
            const [available, setAvailable] = useState([]);
            const [panels, setPanels] = useState([]);
            const [playlists, setPlaylists] = useState([]);
            const [schedule, setSchedule] = useState({ rules: [], active_playlist: null });
            const [config, setConfig] = useState({ layout_mode: 'cycle', cycle_interval: 10 });
            const [error, setError] = useState(null);
            const [previewingAll, setPreviewingAll] = useState(false);
            const [imgTick, setImgTick] = useState(Date.now());
            const dragFrom = useRef(null);
            const dragTo = useRef(null);

            const refresh = useCallback(async (err) => {
                if (err) setError(err);
                const [a, av, c, p, pl, sc] = await Promise.all([
                    api('/apps'),
                    api('/apps/available'),
                    api('/config'),
                    api('/panels'),
                    api('/playlists'),
                    api('/schedule'),
                ]);
                setApps(a);
                setAvailable(av);
                setConfig(c);
                setPanels(p);
                setPlaylists(pl);
                setSchedule(sc);
                setImgTick(Date.now());
            }, []);

            useEffect(() => { refresh(); }, []);

            // Auto-refresh app list every 15s
            useEffect(() => {
                const id = setInterval(refresh, 15000);
                return () => clearInterval(id);
            }, [refresh]);

            const active = apps
                .filter(a => a.enabled && a.active)
                .sort((a, b) => a.sort_order - b.sort_order);
            const enabled = apps.filter(a => a.enabled && !a.active);
            const disabled = apps.filter(a => !a.enabled);

            // --- Drag to reorder ---
            const handleDrop = async (targetName) => {
                const from = dragFrom.current;
                const to = targetName;
                if (!from || from === to) return;
                const names = active.map(a => a.name);
                const fromIdx = names.indexOf(from);
                const toIdx = names.indexOf(to);
                if (fromIdx < 0 || toIdx < 0) return;
                names.splice(fromIdx, 1);
                names.splice(toIdx, 0, from);
                await api('/reorder', 'PUT', { order: names });
                refresh();
            };

            // --- Preview all ---
            const previewAll = async () => {
                setPreviewingAll(true);
                try {
                    const results = await api('/preview-all', 'POST');
                    const errors = results.filter(r => r.error);
                    if (errors.length) setError(errors.map(e => e.name).join(', ') + ' failed');
                    refresh();
                } finally {
                    setPreviewingAll(false);
                }
            };

            return html`
                <div class="header">
                    <img class="header-logo" src="/static/assets/phoenix-64.png" alt="" />
                    <span class="header-title">Phoenix</span>
                    <${StatusDots} />
                </div>

                <div class="main-content">
                    <div class="hero">
                        <${LivePreview} />
                        <${ConfigBar} config=${config} onUpdate=${setConfig} />
                    </div>

                    <div class="section-title">Active Apps</div>
                    ${active.length
                        ? html`<div class="app-grid">${active.map(a => html`
                            <${AppCard} key=${a.name} app=${a} onAction=${refresh} imgTick=${imgTick}
                                draggable=${true}
                                onDragStart=${name => { dragFrom.current = name; }}
                                onDragOver=${name => { dragTo.current = name; }}
                                onDragEnd=${() => { dragFrom.current = null; dragTo.current = null; }}
                                onDrop=${handleDrop}
                            />
                        `)}</div>`
                        : html`<p class="empty">No active apps</p>`
                    }

                    ${enabled.length > 0 && html`
                        <div class="section-title">Enabled (not in cycle)</div>
                        <div class="app-grid">${enabled.map(a => html`<${AppCard} key=${a.name} app=${a} onAction=${refresh} imgTick=${imgTick} />`)}</div>
                    `}

                    ${disabled.length > 0 && html`
                        <div class="section-title" style="opacity:0.6">Disabled</div>
                        <div class="disabled-grid">
                            ${disabled.map(a => html`<${DisabledCard} key=${a.name} app=${a} onAction=${refresh} />`)}
                        </div>
                    `}

                    <${CollapsibleSection} title="Schedule" defaultOpen=${false}>
                        <${ScheduleManager} apps=${apps} playlists=${playlists} schedule=${schedule}
                            onUpdate=${refresh} onError=${setError} />
                    <//>

                    <${CollapsibleSection} title="Dashboard Panels" defaultOpen=${true}
                        headerExtra=${html`<${PanelBuilder} onCreated=${refresh} onError=${setError} />`}>
                        ${panels.length > 0
                            ? html`<div class="app-grid">${panels.map(p => html`<${PanelCard} key=${p.id} panel=${p} onAction=${refresh} onError=${setError} imgTick=${imgTick} />`)}</div>`
                            : html`<p class="empty">No panels yet -- create one above</p>`
                        }
                    <//>

                    ${available.length > 0 && html`
                        <${CollapsibleSection} title="Available Applets" defaultOpen=${false}
                            headerExtra=${html`
                                <button class="btn btn-render" disabled=${previewingAll} onClick=${previewAll}>
                                    ${previewingAll ? html`<span class="spinner" /> Previewing...` : 'Preview All'}
                                </button>
                            `}>
                            <div class="app-grid">${available.map(n => html`<${AvailableCard} key=${n} name=${n} onAdd=${refresh} onError=${setError} imgTick=${imgTick} />`)}</div>
                        <//>
                    `}
                </div>

                <${Toast} message=${error} onClose=${() => setError(null)} />
            `;
        }

        render(html`<${App} />`, document.getElementById('app'));
    </script>
</body>
</html>

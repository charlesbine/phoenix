<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='6' y='1' width='4' height='2' fill='%23ff6b35'/><rect x='5' y='3' width='6' height='2' fill='%23ff4500'/><rect x='4' y='5' width='8' height='2' fill='%23ff6b35'/><rect x='3' y='7' width='10' height='2' fill='%23ffa500'/><rect x='4' y='9' width='8' height='2' fill='%23ff4500'/><rect x='5' y='11' width='6' height='2' fill='%23ff6b35'/><rect x='6' y='13' width='4' height='2' fill='%23ffa500'/></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #58a6ff; margin-bottom: 1.5rem; font-size: 1.5rem; }
        h2 {
            color: #8b949e;
            margin: 1.5rem 0 0.75rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .config-bar {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .config-bar label { color: #8b949e; font-size: 0.85rem; }
        .config-bar select, .config-bar input[type=number] {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .top-row {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            align-items: flex-start;
        }
        .live-preview {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1rem;
            flex-shrink: 0;
        }
        .live-preview .label {
            color: #8b949e;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        .live-preview img {
            width: 320px;
            height: 320px;
            image-rendering: pixelated;
            background: #000;
            border-radius: 4px;
            display: block;
        }
        .live-preview .now-playing {
            color: #58a6ff;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            text-align: center;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.75rem;
        }
        .app-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 0.75rem;
            text-align: center;
            transition: border-color 0.15s;
        }
        .app-card:hover { border-color: #484f58; }
        .app-card img {
            width: 128px;
            height: 128px;
            image-rendering: pixelated;
            background: #000;
            border-radius: 4px;
            margin-bottom: 0.4rem;
        }
        .app-card .name { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.2rem; }
        .app-card .meta { font-size: 0.7rem; color: #8b949e; margin-bottom: 0.4rem; }
        .app-card .actions { display: flex; gap: 0.3rem; justify-content: center; flex-wrap: wrap; }

        .btn {
            border: none;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            color: white;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-enable { background: #238636; }
        .btn-disable { background: #da3633; }
        .btn-render { background: #1f6feb; }
        .btn-cycle { background: #8957e5; }
        .btn-add { background: #238636; }

        .config-editor {
            margin-top: 0.4rem;
            text-align: left;
            border-top: 1px solid #30363d;
            padding-top: 0.4rem;
        }
        .config-editor .config-row {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 0.25rem;
            align-items: center;
        }
        .config-editor input {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.7rem;
            flex: 1;
            min-width: 0;
        }
        .config-editor input.key { flex: 0.4; }
        .config-editor .remove-btn {
            background: none;
            border: none;
            color: #da3633;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0 0.2rem;
        }
        .btn-delete { background: #6e1b1b; }
        .btn-config { background: #30363d; }
        .btn-config.has-config { background: #1f6feb; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.15s;
        }
        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 1.5rem;
            width: 90%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
        }
        .modal h2 {
            color: #c9d1d9;
            font-size: 1.1rem;
            margin: 0 0 1rem;
            text-transform: none;
            letter-spacing: 0;
        }
        .modal .field { margin-bottom: 0.75rem; }
        .modal .field label {
            display: block;
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 0.25rem;
        }
        .modal .field input,
        .modal .field select {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .modal .field input:focus,
        .modal .field select:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .modal .field-row {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.3rem;
            align-items: center;
        }
        .modal .field-row input,
        .modal .field-row select {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 0.35rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            flex: 1;
            min-width: 0;
        }
        .modal .actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            justify-content: flex-end;
        }
        .modal .actions .btn {
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
        }
        .modal .divider {
            border-top: 1px solid #30363d;
            margin: 0.75rem 0;
        }

        .empty { color: #484f58; font-style: italic; padding: 0.5rem 0; font-size: 0.9rem; }

        .available-card {
            background: #161b22;
            border: 1px dashed #30363d;
            border-radius: 8px;
            padding: 0.75rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }
        .available-card .name { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; color: #8b949e; }

        .section-header {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            margin: 1.5rem 0 0.75rem;
        }
        .section-header h2 { margin: 0; }

        .app-card[draggable="true"] { cursor: grab; }
        .app-card[draggable="true"]:active { cursor: grabbing; }
        .app-card.drag-over {
            border-color: #58a6ff;
            border-style: dashed;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: #da3633;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            max-width: 400px;
            animation: fadeIn 0.2s;
            z-index: 100;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { h, render } from 'https://esm.sh/preact@10.25.4';
        import { useState, useEffect, useCallback, useRef } from 'https://esm.sh/preact@10.25.4/hooks';
        import htm from 'https://esm.sh/htm@3.1.1';

        const html = htm.bind(h);

        // --- API helpers ---
        async function api(path, method = 'GET', body = null) {
            const opts = { method, headers: {} };
            if (body) {
                opts.headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(body);
            }
            const res = await fetch('/api' + path, opts);
            return res.json();
        }

        // Global image cache buster — incremented on renders
        let globalImgKey = Date.now();

        // --- Components ---

        function LivePreview() {
            const [src, setSrc] = useState('/data/output/current_display.webp?t=0');
            const [appName, setAppName] = useState('');
            useEffect(() => {
                const refresh = async () => {
                    setSrc('/data/output/current_display.webp?t=' + Date.now());
                    try {
                        const r = await api('/now-playing');
                        setAppName(r.app || '');
                    } catch {}
                };
                refresh();
                const id = setInterval(refresh, 2000);
                return () => clearInterval(id);
            }, []);
            return html`
                <div class="live-preview">
                    <div class="label">Now Playing</div>
                    <img src=${src} alt="Live display" />
                    ${appName && html`<div class="now-playing">${appName.replace(/_/g, ' ')}</div>`}
                </div>
            `;
        }

        function ConfigBar({ config, onUpdate }) {
            const [mode, setMode] = useState(config.layout_mode);
            const [interval, setInterval_] = useState(config.cycle_interval);
            const [brightness, setBrightness] = useState(config.brightness ?? 255);

            useEffect(() => {
                setMode(config.layout_mode);
                setInterval_(config.cycle_interval);
                setBrightness(config.brightness ?? 255);
            }, [config]);

            const save = async () => {
                const updated = await api('/config', 'PUT', {
                    layout_mode: mode, cycle_interval: interval, brightness
                });
                onUpdate(updated);
            };

            // Debounced brightness update
            const brightnessTimer = useRef(null);
            const updateBrightness = (val) => {
                setBrightness(val);
                clearTimeout(brightnessTimer.current);
                brightnessTimer.current = setTimeout(async () => {
                    const updated = await api('/config', 'PUT', {
                        layout_mode: mode, cycle_interval: interval, brightness: val
                    });
                    onUpdate(updated);
                }, 150);
            };

            return html`
                <div class="config-bar">
                    <div>
                        <label>Layout</label><br/>
                        <select value=${mode} onChange=${e => setMode(e.target.value)}>
                            <option value="cycle">Cycle</option>
                            <option value="random">Random</option>
                            <option value="single">Single</option>
                        </select>
                    </div>
                    <div>
                        <label>Interval (sec)</label><br/>
                        <input type="number" value=${interval} min="1" max="300" style="width: 70px"
                               onChange=${e => setInterval_(parseInt(e.target.value) || 10)} />
                    </div>
                    <div style="width: 100%">
                        <label>Brightness: ${brightness}</label><br/>
                        <input type="range" min="0" max="255" value=${brightness}
                               style="width: 100%; accent-color: #58a6ff;"
                               onInput=${e => updateBrightness(parseInt(e.target.value))} />
                    </div>
                    <button class="btn btn-enable" onClick=${save}>Update</button>
                </div>
            `;
        }

        function ConfigEditor({ appName, config, onSave }) {
            const [schema, setSchema] = useState(null);
            const [values, setValues] = useState({...config});
            const [dirty, setDirty] = useState(false);
            const [extraEntries, setExtraEntries] = useState([]);

            useEffect(() => {
                api('/apps/' + appName + '/schema').then(s => setSchema(s));
            }, [appName]);

            // Only sync from props when not actively editing
            useEffect(() => {
                if (!dirty) setValues({...config});
            }, [config]);

            const set = (key, val) => {
                setValues(v => ({...v, [key]: val}));
                setDirty(true);
            };
            const save = () => {
                const merged = {...values};
                extraEntries.forEach(([k, v]) => { if (k.trim()) merged[k.trim()] = v; });
                onSave(merged);
                setDirty(false);
            };

            const schemaKeys = (schema || []).map(f => f.id);
            const extraKeys = Object.keys(values).filter(k => !schemaKeys.includes(k));

            const renderField = (field) => {
                const val = values[field.id] || field.default || '';
                if (field.type === 'toggle') {
                    return html`
                        <div class="config-row" key=${field.id}>
                            <label style="flex:1; font-size: 0.75rem; color: #8b949e">${field.name}</label>
                            <input type="checkbox" checked=${val === 'true'}
                                   onChange=${e => set(field.id, e.target.checked ? 'true' : 'false')} />
                        </div>
                    `;
                }
                if (field.type === 'dropdown' && field.options) {
                    return html`
                        <div class="config-row" key=${field.id}>
                            <label style="flex:0.4; font-size: 0.75rem; color: #8b949e">${field.name}</label>
                            <select style="flex:1; background:#0d1117; border:1px solid #30363d; color:#c9d1d9; padding:0.2rem; border-radius:3px; font-size:0.7rem;"
                                    value=${val} onChange=${e => set(field.id, e.target.value)}>
                                ${field.options.map(o => html`<option value=${o.value}>${o.display}</option>`)}
                            </select>
                        </div>
                    `;
                }
                if (field.type === 'datetime') {
                    return html`
                        <div class="config-row" key=${field.id}>
                            <label style="flex:0.4; font-size: 0.75rem; color: #8b949e">${field.name}</label>
                            <input type="datetime-local" value=${val ? val.slice(0, 16) : ''}
                                   style="flex:1; background:#0d1117; border:1px solid #30363d; color:#c9d1d9; padding:0.2rem 0.4rem; border-radius:3px; font-size:0.7rem;"
                                   onChange=${e => set(field.id, e.target.value + ':00Z')} />
                        </div>
                    `;
                }
                if (field.type === 'color') {
                    return html`
                        <div class="config-row" key=${field.id}>
                            <label style="flex:0.4; font-size: 0.75rem; color: #8b949e">${field.name}</label>
                            <input type="color" value=${val || '#000000'} style="flex:0; width:2rem; height:1.5rem; padding:0; border:none; background:none;"
                                   onChange=${e => set(field.id, e.target.value)} />
                        </div>
                    `;
                }
                // text, location, and everything else: plain text input
                return html`
                    <div class="config-row" key=${field.id}>
                        <label style="flex:0.4; font-size: 0.75rem; color: #8b949e">${field.name}</label>
                        <input value=${val} placeholder=${field.desc || field.id}
                               onInput=${e => set(field.id, e.target.value)} />
                    </div>
                `;
            };

            if (schema === null) return html`<div class="config-editor"><span class="spinner" /></div>`;

            return html`
                <div class="config-editor">
                    ${schema.length > 0
                        ? schema.map(renderField)
                        : html`<div style="font-size:0.7rem; color:#484f58; margin-bottom:0.3rem">No schema — add custom keys below</div>`
                    }
                    ${extraKeys.map(k => html`
                        <div class="config-row" key=${k}>
                            <input class="key" value=${k} disabled style="opacity:0.6" />
                            <input value=${values[k] || ''} onInput=${e => set(k, e.target.value)} />
                            <button class="remove-btn" onClick=${() => {
                                const next = {...values};
                                delete next[k];
                                setValues(next);
                                setDirty(true);
                            }}>x</button>
                        </div>
                    `)}
                    <div style="display: flex; gap: 0.3rem; margin-top: 0.3rem;">
                        <button class="btn btn-config" onClick=${() => setExtraEntries([...extraEntries, ['', '']])}>+ Custom</button>
                        ${dirty && html`<button class="btn btn-enable" onClick=${save}>Save</button>`}
                    </div>
                    ${extraEntries.map(([k, v], i) => html`
                        <div class="config-row" key=${'extra-' + i}>
                            <input class="key" value=${k} placeholder="key"
                                   onInput=${e => { const n = [...extraEntries]; n[i] = [e.target.value, v]; setExtraEntries(n); setDirty(true); }} />
                            <input value=${v} placeholder="value"
                                   onInput=${e => { const n = [...extraEntries]; n[i] = [k, e.target.value]; setExtraEntries(n); setDirty(true); }} />
                            <button class="remove-btn" onClick=${() => { setExtraEntries(extraEntries.filter((_, j) => j !== i)); setDirty(true); }}>x</button>
                        </div>
                    `)}
                </div>
            `;
        }

        function AppCard({ app, onAction, draggable, onDragStart, onDragOver, onDragEnd, onDrop, imgTick }) {
            const [rendering, setRendering] = useState(false);
            const [renderKey, setRenderKey] = useState(0);
            const [dragOver, setDragOver] = useState(false);
            const [showConfig, setShowConfig] = useState(false);

            // Image cache key: combines the polling tick with manual render bumps
            const imgKey = (imgTick || 0) + renderKey;

            const action = async (act) => {
                if (act === 'render') setRendering(true);
                try {
                    const result = await api('/apps/' + app.name + '/' + act, 'POST');
                    if (result.error) throw new Error(result.error);
                    if (act === 'render') setRenderKey(Date.now());
                    onAction();
                } catch(e) {
                    onAction(e.message);
                } finally {
                    setRendering(false);
                }
            };

            const saveConfig = async (cfg) => {
                await api('/apps/' + app.name + '/config', 'PUT', cfg);
                onAction();
            };

            const deleteApp = async () => {
                if (!confirm('Remove ' + app.name + ' from the database?')) return;
                await api('/apps/' + app.name, 'DELETE');
                onAction();
            };

            const saveRefreshInterval = async (seconds) => {
                await api('/apps/' + app.name + '/refresh-interval', 'PUT', { refresh_interval: seconds });
                onAction();
            };

            const dragProps = draggable ? {
                draggable: true,
                onDragStart: e => { e.dataTransfer.effectAllowed = 'move'; onDragStart(app.name); },
                onDragOver: e => { e.preventDefault(); setDragOver(true); onDragOver(app.name); },
                onDragLeave: () => setDragOver(false),
                onDrop: e => { e.preventDefault(); setDragOver(false); onDrop(app.name); },
                onDragEnd,
            } : {};

            const hasConfig = app.pixlet_config && Object.keys(app.pixlet_config).length > 0;

            return html`
                <div class=${'app-card' + (dragOver ? ' drag-over' : '')} ...${dragProps}>
                    <img src=${'/static/outputs/' + app.name + '.large.webp?t=' + imgKey}
                         alt=${app.name} onError=${e => e.target.style.opacity = '0.15'} />
                    <div class="name">${app.name}</div>
                    <div class="meta">${app.last_updated_human}</div>
                    <div class="actions">
                        ${app.enabled
                            ? html`<button class="btn btn-disable" onClick=${() => action('disable')}>Disable</button>`
                            : html`<button class="btn btn-enable" onClick=${() => action('enable')}>Enable</button>`
                        }
                        ${app.active
                            ? html`<button class="btn btn-cycle" onClick=${() => action('deactivate')}>Remove</button>`
                            : html`<button class="btn btn-cycle" onClick=${() => action('activate')}>Add to cycle</button>`
                        }
                        <button class="btn btn-render" disabled=${rendering} onClick=${() => action('render')}>
                            ${rendering ? html`<span class="spinner" />` : 'Render'}
                        </button>
                        <button class=${'btn btn-config' + (hasConfig ? ' has-config' : '')}
                                onClick=${() => setShowConfig(!showConfig)}>
                            ${showConfig ? 'Close' : 'Config'}
                        </button>
                        <button class="btn btn-delete" onClick=${deleteApp}>Delete</button>
                    </div>
                    ${showConfig && html`
                        <${ConfigEditor} appName=${app.name} config=${app.pixlet_config} onSave=${saveConfig} />
                        <div class="config-editor" style="border-top: none; padding-top: 0;">
                            <div class="config-row">
                                <label style="flex:0.6; font-size: 0.75rem; color: #8b949e">Refresh (sec)</label>
                                <input type="number" min="10" max="86400" value=${app.refresh_interval}
                                       style="flex:1; background:#0d1117; border:1px solid #30363d; color:#c9d1d9; padding:0.2rem 0.4rem; border-radius:3px; font-size:0.7rem;"
                                       onChange=${e => saveRefreshInterval(parseInt(e.target.value) || 60)} />
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        function AvailableCard({ name, onAdd, onError, imgTick }) {
            const [adding, setAdding] = useState(false);
            const [previewing, setPreviewing] = useState(false);
            const [renderKey, setRenderKey] = useState(0);
            const imgKey = (imgTick || 0) + renderKey;
            const add = async () => {
                setAdding(true);
                await api('/apps/' + name + '/add', 'POST');
                onAdd();
            };
            const preview = async () => {
                setPreviewing(true);
                try {
                    const result = await api('/apps/' + name + '/preview', 'POST');
                    if (result.error) {
                        onError(result.error);
                    } else {
                        setRenderKey(Date.now());
                    }
                } finally {
                    setPreviewing(false);
                }
            };
            return html`
                <div class="app-card">
                    <img src=${'/static/outputs/' + name + '.large.webp?t=' + imgKey}
                         alt=${name} onError=${e => e.target.style.opacity = '0.15'} />
                    <div class="name" style="color: #8b949e">${name}</div>
                    <div class="actions" style="margin-top: 0.4rem">
                        <button class="btn btn-render" disabled=${previewing} onClick=${preview}>
                            ${previewing ? html`<span class="spinner" />` : 'Preview'}
                        </button>
                        <button class="btn btn-add" disabled=${adding} onClick=${add}>
                            ${adding ? html`<span class="spinner" />` : 'Add'}
                        </button>
                    </div>
                </div>
            `;
        }

        // Stable field wrapper — defined outside component to avoid remount
        const F = ({label, children}) => html`<div class="field"><label>${label}</label>${children}</div>`;

        const LAYOUTS = [
            { value: 'big_number', label: 'Big Number' },
            { value: 'key_value', label: 'Key/Value List' },
            { value: 'marquee', label: 'Scrolling Text' },
            { value: 'multi_stat', label: 'Multi Stat' },
        ];

        function PanelBuilder({ onCreated, onError }) {
            const [open, setOpen] = useState(false);
            const [creating, setCreating] = useState(false);
            const [id, setId] = useState('');
            const [title, setTitle] = useState('');
            const [layout, setLayout] = useState('big_number');
            const [sourceType, setSourceType] = useState('static');
            const [url, setUrl] = useState('');
            const [ttl, setTtl] = useState(300);
            const [authType, setAuthType] = useState('none');
            const [authToken, setAuthToken] = useState('');
            const [authHeader, setAuthHeader] = useState('X-API-Key');
            const [mqttTopic, setMqttTopic] = useState('');
            const [haEntityId, setHaEntityId] = useState('');
            const [haTtl, setHaTtl] = useState(60);
            const [value, setValue] = useState('');
            const [unit, setUnit] = useState('');
            const [color, setColor] = useState('#FFFFFF');
            const [text, setText] = useState('');
            const [items, setItems] = useState([{ key: '', value: '' }]);
            const [stats, setStats] = useState([{ label: '', value: '', color: '#FFFFFF' }]);
            const [valuePath, setValuePath] = useState('');
            const [valueTransform, setValueTransform] = useState('');
            const [textPath, setTextPath] = useState('');
            const [itemMappings, setItemMappings] = useState([{ key: '', value_path: '', unit: '' }]);
            const [statMappings, setStatMappings] = useState([{ label: '', value_path: '', unit: '', color: '#FFFFFF' }]);

            const [previewUrl, setPreviewUrl] = useState('');
            const [previewing, setPreviewing] = useState(false);
            const previewTimer = useRef(null);

            const refreshPreview = () => {
                clearTimeout(previewTimer.current);
                previewTimer.current = setTimeout(async () => {
                    const config = { color };
                    const data_source = { type: sourceType };
                    const addMappings = (ds) => {
                        ds.mappings = {};
                        if (layout === 'big_number') { ds.mappings.value = valuePath; if (valueTransform) ds.mappings.transform = valueTransform; config.unit = unit; }
                        else if (layout === 'key_value') { ds.mappings.items = itemMappings.filter(m => m.key); }
                        else if (layout === 'marquee') { ds.mappings.text = textPath; }
                        else if (layout === 'multi_stat') { ds.mappings.stats = statMappings.filter(m => m.label); }
                    };
                    if (sourceType === 'http') {
                        data_source.url = url; data_source.ttl = ttl;
                        if (authType !== 'none') {
                            data_source.auth = { type: authType, token: authToken };
                            if (authType === 'api_key') data_source.auth.header = authHeader;
                        }
                        addMappings(data_source);
                    } else if (sourceType === 'mqtt') {
                        data_source.topic = mqttTopic;
                        addMappings(data_source);
                    } else if (sourceType === 'ha') {
                        data_source.entity_id = haEntityId;
                        data_source.ttl = haTtl;
                        addMappings(data_source);
                    } else {
                        if (layout === 'big_number') { config.value = value || '42'; config.unit = unit; }
                        else if (layout === 'key_value') { config.items = items.filter(i => i.key).length ? items.filter(i => i.key) : [{key:'Label', value:'Value'}]; }
                        else if (layout === 'marquee') { config.text = text || 'Preview text...'; }
                        else if (layout === 'multi_stat') { config.stats = stats.filter(s => s.label).length ? stats.filter(s => s.label) : [{label:'Stat', value:'0', color:'#FFFFFF'}]; }
                    }
                    setPreviewing(true);
                    try {
                        const r = await fetch('/api/panels/preview', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ layout, title: title || 'Preview', config, data_source }),
                        });
                        const result = await r.json();
                        if (result.preview_url) setPreviewUrl(result.preview_url);
                    } finally { setPreviewing(false); }
                }, 500);
            };

            // Auto-preview on any change (debounced 500ms in refreshPreview)
            const depsKey = [open, layout, sourceType, title, value, unit, color, text, url, ttl, valuePath, textPath,
                authType, authToken, authHeader, mqttTopic, haEntityId, haTtl,
                JSON.stringify(items), JSON.stringify(stats), JSON.stringify(itemMappings), JSON.stringify(statMappings)].join('|');
            useEffect(() => { if (open) refreshPreview(); }, [depsKey]);

            const reset = () => {
                setId(''); setTitle(''); setValue(''); setUnit(''); setText('');
                setColor('#FFFFFF'); setUrl(''); setTtl(300); setValuePath(''); setTextPath('');
                setAuthType('none'); setAuthToken(''); setAuthHeader('X-API-Key');
                setMqttTopic(''); setHaEntityId(''); setHaTtl(60);
                setLayout('big_number'); setSourceType('static');
                setItems([{ key: '', value: '' }]); setStats([{ label: '', value: '', color: '#FFFFFF' }]);
                setItemMappings([{ key: '', value_path: '', unit: '' }]);
                setStatMappings([{ label: '', value_path: '', unit: '', color: '#FFFFFF' }]);
            };

            const close = () => { setOpen(false); reset(); };

            const create = async () => {
                if (!id.trim()) { onError('Panel ID is required'); return; }
                setCreating(true);
                try {
                    const config = { color };
                    const data_source = { type: sourceType };
                    const addCreateMappings = (ds) => {
                        ds.mappings = {};
                        if (layout === 'big_number') { ds.mappings.value = valuePath; if (valueTransform) ds.mappings.transform = valueTransform; config.unit = unit; }
                        else if (layout === 'key_value') { ds.mappings.items = itemMappings.filter(m => m.key); }
                        else if (layout === 'marquee') { ds.mappings.text = textPath; }
                        else if (layout === 'multi_stat') { ds.mappings.stats = statMappings.filter(m => m.label); }
                    };
                    if (sourceType === 'http') {
                        data_source.url = url; data_source.ttl = ttl;
                        if (authType !== 'none') {
                            data_source.auth = { type: authType, token: authToken };
                            if (authType === 'api_key') data_source.auth.header = authHeader;
                        }
                        addCreateMappings(data_source);
                    } else if (sourceType === 'mqtt') {
                        data_source.topic = mqttTopic;
                        addCreateMappings(data_source);
                    } else if (sourceType === 'ha') {
                        data_source.entity_id = haEntityId;
                        data_source.ttl = haTtl;
                        addCreateMappings(data_source);
                    } else {
                        if (layout === 'big_number') { config.value = value; config.unit = unit; }
                        else if (layout === 'key_value') { config.items = items.filter(i => i.key); }
                        else if (layout === 'marquee') { config.text = text; }
                        else if (layout === 'multi_stat') { config.stats = stats.filter(s => s.label); }
                    }
                    const result = await api('/panels', 'POST', {
                        id: id.trim().toLowerCase().replace(/\s+/g, '_'),
                        layout, title, config, data_source,
                    });
                    if (result.error) { onError(result.error); return; }
                    close();
                    onCreated();
                } finally { setCreating(false); }
            };

            if (!open) {
                return html`<button class="btn btn-enable" onClick=${() => setOpen(true)}>+ New Panel</button>`;
            }

            return html`
                <div class="modal-overlay" onClick=${e => { if (e.target === e.currentTarget) close(); }}>
                    <div class="modal">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem;">
                            <h2 style="margin:0">Create Dashboard Panel</h2>
                            <div style="flex-shrink:0; margin-left:1rem; text-align:center;">
                                <div style="position:relative; display:inline-block;">
                                    <img src=${previewUrl || ''} alt="Preview"
                                         style="width:128px; height:128px; image-rendering:pixelated; background:#000; border-radius:6px; border:1px solid #30363d; display:block;"
                                         onError=${e => e.target.style.opacity = '0.15'} />
                                    ${previewing && html`<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;"><span class="spinner" /></div>`}
                                </div>
                                <button class="btn btn-render" style="margin-top:0.4rem" disabled=${previewing} onClick=${refreshPreview}>
                                    ${previewing ? 'Rendering...' : 'Preview'}
                                </button>
                            </div>
                        </div>

                        <${F} label="Panel ID">
                            <input value=${id} placeholder="e.g. btc_price, home_temps"
                                   onInput=${e => setId(e.target.value)} />
                        <//>
                        <${F} label="Display Title">
                            <input value=${title} placeholder="What appears above the data"
                                   onInput=${e => setTitle(e.target.value)} />
                        <//>

                        <div style="display:flex; gap:0.75rem;">
                            <${F} label="Layout">
                                <select value=${layout} onChange=${e => setLayout(e.target.value)}>
                                    ${LAYOUTS.map(l => html`<option value=${l.value}>${l.label}</option>`)}
                                </select>
                            <//>
                            <${F} label="Data Source">
                                <select value=${sourceType} onChange=${e => setSourceType(e.target.value)}>
                                    <option value="static">Static Values</option>
                                    <option value="http">HTTP JSON</option>
                                    <option value="mqtt">MQTT Topic</option>
                                    <option value="ha">Home Assistant</option>
                                </select>
                            <//>
                            <${F} label="Color">
                                <input type="color" value=${color} style="height:2.1rem; padding:0.2rem;"
                                       onChange=${e => setColor(e.target.value)} />
                            <//>
                        </div>

                        ${sourceType === 'http' && html`
                            <div class="divider" />
                            <${F} label="JSON URL">
                                <input value=${url} placeholder="https://api.example.com/data.json"
                                       onInput=${e => setUrl(e.target.value)} />
                            <//>
                            <${F} label="Cache TTL (seconds)">
                                <input type="number" value=${ttl} min="10"
                                       onChange=${e => setTtl(parseInt(e.target.value) || 300)} />
                            <//>
                            <${F} label="Authentication">
                                <select value=${authType} onChange=${e => setAuthType(e.target.value)}>
                                    <option value="none">None</option>
                                    <option value="bearer">Bearer Token</option>
                                    <option value="api_key">API Key Header</option>
                                    <option value="basic">Basic Auth</option>
                                </select>
                            <//>
                            ${authType === 'bearer' && html`
                                <${F} label="Token">
                                    <input type="text" autocomplete="off" data-1p-ignore value=${authToken} placeholder="your-token-here"
                                           onInput=${e => setAuthToken(e.target.value)} />
                                <//>
                            `}
                            ${authType === 'api_key' && html`
                                <${F} label="Header Name">
                                    <input value=${authHeader} placeholder="X-API-Key"
                                           onInput=${e => setAuthHeader(e.target.value)} />
                                <//>
                                <${F} label="API Key">
                                    <input type="text" autocomplete="off" data-1p-ignore value=${authToken} placeholder="your-api-key"
                                           onInput=${e => setAuthToken(e.target.value)} />
                                <//>
                            `}
                            ${authType === 'basic' && html`
                                <${F} label="Username:Password">
                                    <input type="text" autocomplete="off" data-1p-ignore value=${authToken} placeholder="user:pass"
                                           onInput=${e => setAuthToken(e.target.value)} />
                                <//>
                            `}
                        `}

                        ${sourceType === 'mqtt' && html`
                            <div class="divider" />
                            <${F} label="MQTT Topic">
                                <input value=${mqttTopic} placeholder="home/living/temperature"
                                       onInput=${e => setMqttTopic(e.target.value)} />
                            <//>
                        `}

                        ${sourceType === 'ha' && html`
                            <div class="divider" />
                            <${F} label="Entity ID">
                                <input value=${haEntityId} placeholder="sensor.living_room_temperature"
                                       onInput=${e => setHaEntityId(e.target.value)} />
                            <//>
                            <${F} label="Cache TTL (seconds)">
                                <input type="number" value=${haTtl} min="5"
                                       onChange=${e => setHaTtl(parseInt(e.target.value) || 60)} />
                            <//>
                            <div style="font-size:0.7rem; color:#484f58; margin-bottom:0.5rem;">
                                Value paths: state, friendly_name, unit_of_measurement, or any attribute
                            </div>
                        `}

                        <div class="divider" />

                        ${layout === 'big_number' && html`
                            ${sourceType === 'static'
                                ? html`<${F} label="Value"><input value=${value} placeholder="72" onInput=${e => setValue(e.target.value)} /><//>`
                                : html`
                                    <${F} label="Value JSONPath"><input value=${valuePath} placeholder="data.temperature" onInput=${e => setValuePath(e.target.value)} /><//>
                                    <${F} label="Transform"><input value=${valueTransform} placeholder="/ 100 | round 2 | format $%.2f" onInput=${e => setValueTransform(e.target.value)} /><//>
                                `
                            }
                            <${F} label="Unit"><input value=${unit} placeholder="°F" onInput=${e => setUnit(e.target.value)} /><//>
                        `}

                        ${layout === 'marquee' && html`
                            ${sourceType === 'static'
                                ? html`<${F} label="Text"><input value=${text} placeholder="Scrolling message..." onInput=${e => setText(e.target.value)} /><//>`
                                : html`<${F} label="Text JSONPath"><input value=${textPath} placeholder="data.headline" onInput=${e => setTextPath(e.target.value)} /><//>`
                            }
                        `}

                        ${layout === 'key_value' && html`
                            <label style="font-size:0.8rem; color:#8b949e; display:block; margin-bottom:0.3rem;">Rows</label>
                            ${(sourceType === 'static' ? items : itemMappings).map((item, i) => html`
                                <div class="field-row" key=${i}>
                                    <input value=${item.key || item.key} placeholder="Label"
                                           onInput=${e => {
                                               if (sourceType === 'static') { const n = [...items]; n[i] = {...n[i], key: e.target.value}; setItems(n); }
                                               else { const n = [...itemMappings]; n[i] = {...n[i], key: e.target.value}; setItemMappings(n); }
                                           }} />
                                    <input value=${sourceType === 'static' ? item.value : item.value_path} placeholder=${sourceType === 'static' ? 'Value' : 'json.path'}
                                           onInput=${e => {
                                               if (sourceType === 'static') { const n = [...items]; n[i] = {...n[i], value: e.target.value}; setItems(n); }
                                               else { const n = [...itemMappings]; n[i] = {...n[i], value_path: e.target.value}; setItemMappings(n); }
                                           }} />
                                    ${sourceType === 'http' && html`
                                        <input style="max-width:4rem" value=${item.unit || ''} placeholder="unit"
                                               onInput=${e => { const n = [...itemMappings]; n[i] = {...n[i], unit: e.target.value}; setItemMappings(n); }} />
                                    `}
                                    <button class="remove-btn" style="color:#da3633; background:none; border:none; cursor:pointer; font-size:1rem;"
                                            onClick=${() => {
                                                if (sourceType === 'static') setItems(items.filter((_, j) => j !== i));
                                                else setItemMappings(itemMappings.filter((_, j) => j !== i));
                                            }}>x</button>
                                </div>
                            `)}
                            <button class="btn btn-config" style="margin-top:0.2rem" onClick=${() => sourceType === 'static'
                                ? setItems([...items, { key: '', value: '' }])
                                : setItemMappings([...itemMappings, { key: '', value_path: '', unit: '' }])
                            }>+ Add Row</button>
                        `}

                        ${layout === 'multi_stat' && html`
                            <label style="font-size:0.8rem; color:#8b949e; display:block; margin-bottom:0.3rem;">Stats</label>
                            ${(sourceType === 'static' ? stats : statMappings).map((s, i) => html`
                                <div class="field-row" key=${i}>
                                    <input value=${s.label} placeholder="Label"
                                           onInput=${e => {
                                               if (sourceType === 'static') { const n = [...stats]; n[i] = {...n[i], label: e.target.value}; setStats(n); }
                                               else { const n = [...statMappings]; n[i] = {...n[i], label: e.target.value}; setStatMappings(n); }
                                           }} />
                                    <input value=${sourceType === 'static' ? s.value : s.value_path} placeholder=${sourceType === 'static' ? 'Value' : 'json.path'}
                                           onInput=${e => {
                                               if (sourceType === 'static') { const n = [...stats]; n[i] = {...n[i], value: e.target.value}; setStats(n); }
                                               else { const n = [...statMappings]; n[i] = {...n[i], value_path: e.target.value}; setStatMappings(n); }
                                           }} />
                                    ${sourceType === 'http' && html`
                                        <input style="max-width:4rem" value=${s.unit || ''} placeholder="unit"
                                               onInput=${e => { const n = [...statMappings]; n[i] = {...n[i], unit: e.target.value}; setStatMappings(n); }} />
                                    `}
                                    <input type="color" value=${s.color} style="flex:0; width:2rem; min-width:2rem;"
                                           onChange=${e => {
                                               if (sourceType === 'static') { const n = [...stats]; n[i] = {...n[i], color: e.target.value}; setStats(n); }
                                               else { const n = [...statMappings]; n[i] = {...n[i], color: e.target.value}; setStatMappings(n); }
                                           }} />
                                    <button class="remove-btn" style="color:#da3633; background:none; border:none; cursor:pointer; font-size:1rem;"
                                            onClick=${() => {
                                                if (sourceType === 'static') setStats(stats.filter((_, j) => j !== i));
                                                else setStatMappings(statMappings.filter((_, j) => j !== i));
                                            }}>x</button>
                                </div>
                            `)}
                            <button class="btn btn-config" style="margin-top:0.2rem" onClick=${() => sourceType === 'static'
                                ? setStats([...stats, { label: '', value: '', color: '#FFFFFF' }])
                                : setStatMappings([...statMappings, { label: '', value_path: '', unit: '', color: '#FFFFFF' }])
                            }>+ Add Stat</button>
                        `}

                        <div class="actions">
                            <button class="btn btn-config" onClick=${close}>Cancel</button>
                            <button class="btn btn-enable" disabled=${creating} onClick=${create}>
                                ${creating ? html`<span class="spinner" /> Creating...` : 'Create Panel'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function PanelCard({ panel, onAction, onError, imgTick }) {
            const [deleting, setDeleting] = useState(false);
            const [editing, setEditing] = useState(false);
            const [editConfig, setEditConfig] = useState(JSON.stringify(panel.config || {}, null, 2));
            const [editSource, setEditSource] = useState(JSON.stringify(panel.data_source || {}, null, 2));
            const [editTitle, setEditTitle] = useState(panel.title);
            const [saving, setSaving] = useState(false);

            const del_ = async () => {
                if (!confirm('Delete panel ' + panel.id + '?')) return;
                setDeleting(true);
                await api('/panels/' + panel.id, 'DELETE');
                onAction();
            };
            const save = async () => {
                setSaving(true);
                try {
                    const result = await api('/panels/' + panel.id, 'PUT', {
                        title: editTitle,
                        config: JSON.parse(editConfig),
                        data_source: JSON.parse(editSource),
                    });
                    if (result.error) { onError(result.error); return; }
                    setEditing(false);
                    onAction();
                } catch(e) { onError(e.message); }
                finally { setSaving(false); }
            };

            if (editing) {
                const taStyle = "width:100%; background:#0d1117; border:1px solid #30363d; color:#c9d1d9; padding:0.4rem; border-radius:6px; font-size:0.75rem; font-family:monospace; resize:vertical;";
                return html`
                    <div class="modal-overlay" onClick=${e => { if (e.target === e.currentTarget) setEditing(false); }}>
                        <div class="modal">
                            <h2 style="margin:0 0 1rem">Edit: ${panel.id}</h2>
                            <${F} label="Title">
                                <input value=${editTitle} onInput=${e => setEditTitle(e.target.value)} />
                            <//>
                            <${F} label="Config (JSON)">
                                <textarea rows="4" style=${taStyle} value=${editConfig}
                                          onInput=${e => setEditConfig(e.target.value)} />
                            <//>
                            <${F} label="Data Source (JSON)">
                                <textarea rows="8" style=${taStyle} value=${editSource}
                                          onInput=${e => setEditSource(e.target.value)} />
                            <//>
                            <div class="actions">
                                <button class="btn btn-config" onClick=${() => setEditing(false)}>Cancel</button>
                                <button class="btn btn-enable" disabled=${saving} onClick=${save}>
                                    ${saving ? html`<span class="spinner" />` : 'Save & Re-render'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            return html`
                <div class="app-card">
                    <img src=${'/static/outputs/panel_' + panel.id + '.large.webp?t=' + (imgTick || 0)}
                         alt=${panel.id} onError=${e => e.target.style.opacity = '0.15'} />
                    <div class="name">${panel.title || panel.id}</div>
                    <div class="meta">${panel.layout} · ${panel.data_source?.type || 'static'}</div>
                    <div class="actions">
                        <button class="btn btn-config" onClick=${() => setEditing(true)}>Edit</button>
                        <button class="btn btn-delete" disabled=${deleting} onClick=${del_}>Delete</button>
                    </div>
                </div>
            `;
        }

        function Toast({ message, onClose }) {
            useEffect(() => {
                const t = setTimeout(onClose, 4000);
                return () => clearTimeout(t);
            }, [message]);
            if (!message) return null;
            return html`<div class="toast" onClick=${onClose}>${message}</div>`;
        }

        function App() {
            const [apps, setApps] = useState([]);
            const [available, setAvailable] = useState([]);
            const [panels, setPanels] = useState([]);
            const [config, setConfig] = useState({ layout_mode: 'cycle', cycle_interval: 10 });
            const [error, setError] = useState(null);
            const [previewingAll, setPreviewingAll] = useState(false);
            const [imgTick, setImgTick] = useState(Date.now());
            const dragFrom = useRef(null);
            const dragTo = useRef(null);

            const refresh = useCallback(async (err) => {
                if (err) setError(err);
                const [a, av, c, p] = await Promise.all([
                    api('/apps'),
                    api('/apps/available'),
                    api('/config'),
                    api('/panels'),
                ]);
                setApps(a);
                setAvailable(av);
                setConfig(c);
                setPanels(p);
                setImgTick(Date.now());
            }, []);

            useEffect(() => { refresh(); }, []);

            // Auto-refresh app list every 15s
            useEffect(() => {
                const id = setInterval(refresh, 15000);
                return () => clearInterval(id);
            }, [refresh]);

            const active = apps
                .filter(a => a.enabled && a.active)
                .sort((a, b) => a.sort_order - b.sort_order);
            const enabled = apps.filter(a => a.enabled && !a.active);
            const disabled = apps.filter(a => !a.enabled);

            // --- Drag to reorder ---
            const handleDrop = async (targetName) => {
                const from = dragFrom.current;
                const to = targetName;
                if (!from || from === to) return;
                const names = active.map(a => a.name);
                const fromIdx = names.indexOf(from);
                const toIdx = names.indexOf(to);
                if (fromIdx < 0 || toIdx < 0) return;
                names.splice(fromIdx, 1);
                names.splice(toIdx, 0, from);
                await api('/reorder', 'PUT', { order: names });
                refresh();
            };

            // --- Preview all ---
            const previewAll = async () => {
                setPreviewingAll(true);
                try {
                    const results = await api('/preview-all', 'POST');
                    const errors = results.filter(r => r.error);
                    if (errors.length) setError(errors.map(e => e.name).join(', ') + ' failed');
                    refresh();
                } finally {
                    setPreviewingAll(false);
                }
            };

            return html`
                <h1>Phoenix</h1>

                <div class="top-row">
                    <${LivePreview} />
                    <${ConfigBar} config=${config} onUpdate=${setConfig} />
                </div>

                <h2>Active Apps</h2>
                ${active.length
                    ? html`<div class="app-grid">${active.map(a => html`
                        <${AppCard} key=${a.name} app=${a} onAction=${refresh} imgTick=${imgTick}
                            draggable=${true}
                            onDragStart=${name => { dragFrom.current = name; }}
                            onDragOver=${name => { dragTo.current = name; }}
                            onDragEnd=${() => { dragFrom.current = null; dragTo.current = null; }}
                            onDrop=${handleDrop}
                        />
                    `)}</div>`
                    : html`<p class="empty">No active apps</p>`
                }

                ${enabled.length > 0 && html`
                    <h2>Enabled (not in cycle)</h2>
                    <div class="app-grid">${enabled.map(a => html`<${AppCard} key=${a.name} app=${a} onAction=${refresh} imgTick=${imgTick} />`)}</div>
                `}

                ${disabled.length > 0 && html`
                    <h2>Disabled</h2>
                    <div class="app-grid">${disabled.map(a => html`<${AppCard} key=${a.name} app=${a} onAction=${refresh} imgTick=${imgTick} />`)}</div>
                `}

                <div class="section-header">
                    <h2>Dashboard Panels</h2>
                    <${PanelBuilder} onCreated=${refresh} onError=${setError} />
                </div>
                ${panels.length > 0
                    ? html`<div class="app-grid">${panels.map(p => html`<${PanelCard} key=${p.id} panel=${p} onAction=${refresh} onError=${setError} imgTick=${imgTick} />`)}</div>`
                    : html`<p class="empty">No panels yet — create one above</p>`
                }

                ${available.length > 0 && html`
                    <div class="section-header">
                        <h2>Available Applets</h2>
                        <button class="btn btn-render" disabled=${previewingAll} onClick=${previewAll}>
                            ${previewingAll ? html`<span class="spinner" /> Previewing...` : 'Preview All'}
                        </button>
                    </div>
                    <div class="app-grid">${available.map(n => html`<${AvailableCard} key=${n} name=${n} onAdd=${refresh} onError=${setError} imgTick=${imgTick} />`)}</div>
                `}

                <${Toast} message=${error} onClose=${() => setError(null)} />
            `;
        }

        render(html`<${App} />`, document.getElementById('app'));
    </script>
</body>
</html>
